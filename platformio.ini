[tft_common]
build_flags =
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DSMOOTH_FONT
    -DDISABLE_ALL_LIBRARY_WARNINGS

[tft_tdisplay]
build_flags =
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    #-DSPI_READ_FREQUENCY=6000000
    ${tft_common.build_flags}

[tft_tdisplay_s3]
build_flags =
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DCGRAM_OFFSET
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON
    -DTFT_PARALLEL_8_BIT
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    ${tft_common.build_flags}

[env:esp32]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags =
    ${tft_tdisplay.build_flags}
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    h2zero/NimBLE-Arduino @ 2.5.1

[env:esp32s3]
platform = espressif32 @ 7.1.3
board = lilygo-t-display-s3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags =
    ${tft_tdisplay_s3.build_flags}
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    h2zero/NimBLE-Arduino @ 2.5.1
